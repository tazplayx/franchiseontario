name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after 7 days without API activity.
# This pings a site endpoint that queries the database once a day, which
# counts as activity and prevents the pause.

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 6:00 AM UTC
  workflow_dispatch:        # Manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database via site API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://www.franchiseontario.com/api/admin/leads")
          echo "Leads API responded: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Database may be paused or unhealthy (HTTP $STATUS). Check https://supabase.com/dashboard"
            exit 1
          fi
